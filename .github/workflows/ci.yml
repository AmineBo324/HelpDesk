name: HelpDesk API CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: helpdesk_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d helpdesk_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/helpdesk_db
          DB_USERNAME: postgres
          DB_PASSWORD: admin
          JWT_SECRET: WLlbVOPEdBchP2ZAy0LRqhm//U53obFc3Ll09KZg1Mg=
          JWT_EXPIRATION: 86400000
        run: ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t helpdesk-api:latest .
